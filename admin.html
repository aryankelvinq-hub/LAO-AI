
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAO AI | Admin Login</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;place-items:center;
 background:#06110e;color:#fff;font-family:Arial,sans-serif;padding:20px
}
.panel{
 width:100%;max-width:390px;background:#0d1d18;
 border:1px solid #214b3b;border-radius:22px;padding:28px
}
.logo{color:#55e6a5;font-size:28px;font-weight:800;text-align:center}
.sub{text-align:center;color:#91a99c;margin:9px 0 28px}
label{display:block;margin:15px 0 8px;color:#c9ded3}
input{
 width:100%;padding:15px;border:1px solid #315747;
 border-radius:11px;background:#07130f;color:white;font-size:16px
}
button{
 width:100%;padding:15px;margin-top:20px;border:0;
 border-radius:11px;background:#42d99a;color:#052016;
 font-size:16px;font-weight:bold
}
#message{text-align:center;margin-top:18px;color:#ff9b9b}
#dashboard{display:none}
.tools{padding:12px;background:#142b22;border-radius:10px;margin-top:12px}
</style>
</head>
<body>
<div class="panel">
 <div class="logo">LAO AI</div>
 <div class="sub">Administrator Control Center</div>

 <div id="login">
  <label>Admin Password</label>
  <input id="password" type="password" placeholder="Enter admin password">
  <button id="loginBtn" onclick="login()">Secure Login</button>
  <div id="message"></div>
 </div>

 <div id="dashboard">
  <h2>Welcome, Admin!</h2>
  <p>Login successful.</p>
  <div class="tools">AI Tools Management — Coming next</div>
  <button onclick="logout()">Logout</button>
 </div>
</div>

<script>
const API = "https://laoai.aryankelvinq.workers.dev";

async function login(){
 const password=document.getElementById("password").value;
 const message=document.getElementById("message");
 const btn=document.getElementById("loginBtn");

 if(!password){message.textContent="Enter your password";return;}

 btn.disabled=true;
 btn.textContent="Checking...";
 message.textContent="";

 try{
  const response=await fetch(API+"/admin/login",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({password})
  });

  const data=await response.json();

  if(!response.ok) throw new Error(data.error||"Login failed");

  sessionStorage.setItem("lao_admin_token",data.token);
  document.getElementById("login").style.display="none";
  document.getElementById("dashboard").style.display="block";
  document.getElementById("password").value="";
 }catch(error){
  message.textContent=error.message;
 }finally{
  btn.disabled=false;
  btn.textContent="Secure Login";
 }
}

async function logout(){
 sessionStorage.removeItem("lao_admin_token");
 document.getElementById("dashboard").style.display="none";
 document.getElementById("login").style.display="block";
}

async function checkSession(){
 const token=sessionStorage.getItem("lao_admin_token");
 if(!token)return;

 try{
  const response=await fetch(API+"/admin/verify",{
   headers:{Authorization:"Bearer "+token}
  });
  const data=await response.json();

  if(response.ok && data.authenticated){
   document.getElementById("login").style.display="none";
   document.getElementById("dashboard").style.display="block";
  }else{
   sessionStorage.removeItem("lao_admin_token");
  }
 }catch{
  sessionStorage.removeItem("lao_admin_token");
 }
}
checkSession();
</script>
</body>
</html>
